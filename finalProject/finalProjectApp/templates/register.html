
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #171b22;
            color: white;
            font-family: Arial, sans-serif;
        }

        .auth-card {
            background-color: #242b35;
            border: none;
            border-radius: 15px;
            max-width: 650px;
        }

        .auth-form input {
            background-color: #303945;
            color: white;
            border: 1px solid #46515e;
            border-radius: 6px;
            padding: 10px;
            width: 100%;
        }

        .auth-form input:focus {
            background-color: #303945;
            color: white;
            border-color: #8ECAE6;
            box-shadow: 0 0 0 0.2rem rgba(142, 202, 230, 0.2);
        }

        .auth-form label {
            color: white;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .auth-form p {
            margin-bottom: 20px;
        }

        .auth-form ul {
            color: #c5d3df;
            font-size: 14px;
        }

        .auth-form .errorlist {
            color: #ff9999;
        }

        .auth-button {
            background-color: #8ECAE6;
            color: white;
            border: none;
        }

        .auth-button:hover {
            background-color: #6BB8E8;
            color: white;
        }

        .auth-card h1,
        .auth-card p {
            color: white;
        }

        .auth-link {
            color: #8ECAE6;
            text-decoration: none;
        }

        .auth-link:hover {
            color: #6BB8E8;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="card auth-card mx-auto shadow-lg">
            <div class="card-body p-5">

                {% if user.is_authenticated %}

                    <h1 class="fw-bold text-center mb-3">
                        Welcome, {{ user.username }}!
                    </h1>

                    <p class="text-center mb-4">
                        You are currently logged in.
                    </p>

                    <form method="POST" action="{% url 'logout' %}" class="text-center">
                        {% csrf_token %}
                        <button type="submit" class="btn auth-button px-4">
                            Logout
                        </button>
                    </form>

                {% else %}

                    <h1 class="fw-bold text-center mb-2">
                        Create an Account
                    </h1>

                    <p class="text-center mb-4">
                        Join the community and share your music.
                    </p>

                    <form method="POST" class="auth-form">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="text-center mt-4">
                            <button type="submit" class="btn auth-button px-4">
                                Register
                            </button>
                        </div>
                    </form>

                    <hr class="border-secondary my-4">

                    <p class="text-center mb-0">
                        Already have an account?
                        <a href="{% url 'login' %}" class="auth-link">
                            Login here
                        </a>
                    </p>

                {% endif %}

            </div>
        </div>

    </div>

</body>
</html>
