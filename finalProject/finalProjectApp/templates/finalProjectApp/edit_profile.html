<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        body {
            background-color: #171b22;
            color: white;
            font-family: Arial, sans-serif;
        }

        .edit-card {
            background-color: #242b35;
            border: none;
            border-radius: 15px;
            max-width: 650px;
        }

        .bio-input,
        .picture-input {
            background-color: #303945 !important;
            color: white !important;
            border: 1px solid #46515e;
        }

        .bio-input:focus {
            background-color: #303945 !important;
            color: white !important;
            border-color: #8ECAE6;
            box-shadow: 0 0 0 0.2rem rgba(142, 202, 230, 0.2);
        }

        .bio-input::placeholder {
            color: white !important;
            opacity: 1;
        }

        .picture-input::file-selector-button {
            color: white;
            background-color: #46515e;
            border: none;
        }

        .save-button {
            background-color: #8ECAE6;
            color: white;
            border: none;
        }

        .save-button:hover {
            background-color: #6BB8E8;
            color: white;
        }

        .form-label,
        .form-check-label,
        .edit-card h1,
        .edit-card p {
            color: white !important;
        }

        .form-check-input:checked {
            background-color: #8ECAE6;
            border-color: #8ECAE6;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="card edit-card mx-auto shadow-lg">
            <div class="card-body p-5">

                <h1 class="fw-bold text-center mb-2 text-white">
                    Edit Your Profile
                </h1>

                <p class="text-white text-center mb-4">
                    Update your profile picture and bio.
                </p>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="profile_picture" class="form-label fw-bold text-white">
                            Profile Picture
                        </label>

                        <input
                            type="file"
                            name="profile_picture"
                            id="profile_picture"
                            class="form-control picture-input"
                            accept="image/*"
                        >
                    </div>

                    {% if profile.profile_picture %}
                        <div class="form-check mb-4">
                            <input
                                type="checkbox"
                                name="remove_picture"
                                id="remove_picture"
                                class="form-check-input"
                            >

                            <label for="remove_picture" class="form-check-label text-white">
                                Remove current profile picture
                            </label>
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="bio" class="form-label fw-bold text-white">
                            Bio
                        </label>

                        <textarea
                            name="bio"
                            id="bio"
                            class="form-control bio-input"
                            rows="5"
                            placeholder="Write something about yourself..."
                        >{{ profile.bio }}</textarea>
                    </div>

                    <div class="d-flex justify-content-center gap-3 mt-4">

                        <button type="submit" class="btn save-button px-4">
                            Save Changes
                        </button>

                        <a href="{% url 'profile' profile.user.username %}"
                           class="btn btn-outline-secondary px-4">
                            Cancel
                        </a>

                    </div>
                </form>

            </div>
        </div>

    </div>

</body>
</html>
