
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #171b22;
            color: white;
            font-family: Arial, sans-serif;
        }

        .edit-card {
            background-color: #242b35;
            border: none;
            border-radius: 15px;
            max-width: 650px;
        }

        .bio-input {
            background-color: #303945;
            color: white;
            border: 1px solid #46515e;
        }

        .bio-input:focus {
            background-color: #303945;
            color: white;
            border-color: #16a6a1;
            box-shadow: 0 0 0 0.2rem rgba(22, 166, 161, 0.2);
        }

        .bio-input::placeholder {
            color: white;
            opacity: 1;
        }

        .save-button {
            background-color: #16a6a1;
            color: white;
            border: none;
        }

        .save-button:hover {
            background-color: #128782;
            color: white;
        }

        .cancel-link {
            color: white;
            text-decoration: none;
        }

        .cancel-link:hover {
            color: #16a6a1;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="card edit-card mx-auto shadow-lg">
            <div class="card-body p-5">

                <h1 class="fw-bold text-center mb-2 text-white">
                    Edit Your Profile
                </h1>

                <p class="text-white text-center mb-4">
                    Update your bio and tell others a little about yourself.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <label for="bio" class="form-label fw-bold text-white">
                        About Me
                    </label>

                    <textarea
                        name="bio"
                        id="bio"
                        class="form-control bio-input"
                        rows="5"
                        placeholder="Write something about yourself..."
                    >{{ profile.bio }}</textarea>

                    <div class="d-flex justify-content-center gap-3 mt-4">

                        <button type="submit" class="btn save-button px-4">
                            Save Changes
                        </button>

                        <a href="{% url 'profile' profile.user.username %}"
                           class="btn btn-outline-secondary px-4">
                            Cancel
                        </a>

                    </div>
                </form>

            </div>
        </div>

    </div>

</body>
</html>
